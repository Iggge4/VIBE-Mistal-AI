<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VIBE Mistral AI</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #1a1d27;
    --accent: #ff7000;
    --text: #e8e8ee;
    --muted: #8a8fa3;
    --user-bubble: #2b3040;
    --ai-bubble: #232735;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 20px;
    background: var(--panel);
    border-bottom: 1px solid #2a2e3d;
  }
  header img { width: 32px; height: 32px; }
  header h1 { font-size: 1.05rem; font-weight: 600; }
  header .status {
    margin-left: auto;
    font-size: 0.8rem;
    color: var(--muted);
  }
  header .status.ok { color: #4ade80; }
  header .status.err { color: #f87171; }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 78%;
    padding: 12px 16px;
    border-radius: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--user-bubble);
    border-bottom-right-radius: 4px;
  }
  .msg.ai {
    align-self: flex-start;
    background: var(--ai-bubble);
    border-bottom-left-radius: 4px;
  }
  .msg.ai.loading { color: var(--muted); font-style: italic; }
  #form {
    display: flex;
    gap: 10px;
    padding: 16px 20px;
    background: var(--panel);
    border-top: 1px solid #2a2e3d;
  }
  #input {
    flex: 1;
    background: #14161f;
    border: 1px solid #2a2e3d;
    border-radius: 10px;
    color: var(--text);
    padding: 12px 14px;
    font-size: 1rem;
    resize: none;
    font-family: inherit;
  }
  #input:focus { outline: none; border-color: var(--accent); }
  #send {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 0 22px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
  }
  #send:disabled { opacity: 0.5; cursor: default; }
  #clear {
    background: transparent;
    color: var(--muted);
    border: 1px solid #2a2e3d;
    border-radius: 10px;
    padding: 0 14px;
    cursor: pointer;
    font-size: 0.85rem;
  }
  #clear:hover { color: var(--text); }
  #libpanel {
    display: none;
    padding: 12px 20px;
    background: var(--panel);
    border-top: 1px solid #2a2e3d;
    max-height: 220px;
    overflow-y: auto;
  }
  #libpanel.open { display: block; }
  #libpanel .libtitle { color: var(--muted); font-size: 0.8rem; margin-bottom: 8px; }
  #libpanel label {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 0;
    font-size: 0.9rem;
    cursor: pointer;
  }
  #libpanel label .c { color: var(--muted); font-size: 0.75rem; }
  #libpanel .none { color: var(--muted); font-size: 0.85rem; font-style: italic; }
  #namegate {
    position: fixed;
    inset: 0;
    background: rgba(10, 11, 16, 0.92);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  #namegate.hidden { display: none; }
  .gatebox {
    background: var(--panel);
    border: 1px solid #2a2e3d;
    border-radius: 16px;
    padding: 32px;
    width: min(90vw, 380px);
    text-align: center;
  }
  .gatebox h2 { font-size: 1.15rem; margin-bottom: 6px; }
  .gatebox p { color: var(--muted); font-size: 0.85rem; margin-bottom: 18px; }
  .gatebox input {
    width: 100%;
    background: #14161f;
    border: 1px solid #2a2e3d;
    border-radius: 10px;
    color: var(--text);
    padding: 12px 14px;
    font-size: 1rem;
    text-align: center;
  }
  .gatebox input:focus { outline: none; border-color: var(--accent); }
  .gatebox button {
    margin-top: 14px;
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 12px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
  }
  .gateerr { color: #f87171; font-size: 0.8rem; margin-top: 10px; min-height: 1em; }
  header .who { font-size: 0.8rem; color: var(--text); }
  .note-msg {
    align-self: center;
    color: var(--muted);
    font-size: 0.78rem;
    background: var(--panel);
    border: 1px solid #2a2e3d;
    border-radius: 10px;
    padding: 6px 12px;
    max-width: 90%;
  }
</style>
</head>
<body>
<header>
  <img src="/icon.svg" alt="VIBE Mistral AI">
  <h1>VIBE Mistral AI</h1>
  <span class="who" id="who"></span>
  <span class="status" id="status">Kontrollerar anslutning&hellip;</span>
</header>
<div id="namegate">
  <div class="gatebox">
    <h2>Vad heter du?</h2>
    <p>Namnet syns för värddatorn vid varje förfrågan — aldrig innehållet i dina meddelanden.</p>
    <input type="text" id="nameinput" maxlength="60" placeholder="Ditt namn" autofocus>
    <button id="namebtn">Börja chatta</button>
    <div class="gateerr" id="gateerr"></div>
  </div>
</div>
<div id="chat">
  <div class="msg ai">Hej! Jag är din lokala Mistral AI. Ställ en fråga för att börja.</div>
</div>
<div id="libpanel">
  <div class="libtitle">Välj dokument som AI:n ska använda som kunskapskälla:</div>
  <div id="liblist"><span class="none">Laddar bibliotek…</span></div>
</div>
<form id="form">
  <button type="button" id="libtoggle" title="Välj biblioteksdokument">📚 Bibliotek</button>
  <button type="button" id="clear" title="Rensa konversationen">Rensa</button>
  <textarea id="input" rows="1" placeholder="Skriv ett meddelande&hellip;" autofocus></textarea>
  <button type="submit" id="send">Skicka</button>
</form>
<script>
const namegate = document.getElementById("namegate");
const nameinput = document.getElementById("nameinput");
const namebtn = document.getElementById("namebtn");
const gateerr = document.getElementById("gateerr");
const whoEl = document.getElementById("who");

let userName = "";
try { userName = localStorage.getItem("vibe_name") || ""; } catch {}

function applyName() {
  whoEl.textContent = userName ? "Användare: " + userName : "";
  namegate.classList.toggle("hidden", !!userName);
}
applyName();

namebtn.addEventListener("click", () => {
  const name = nameinput.value.trim();
  if (!name) {
    gateerr.textContent = "Du måste skriva ett namn för att chatta.";
    return;
  }
  userName = name;
  try { localStorage.setItem("vibe_name", name); } catch {}
  applyName();
});
nameinput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") namebtn.click();
});

const chat = document.getElementById("chat");
const form = document.getElementById("form");
const input = document.getElementById("input");
const send = document.getElementById("send");
const clearBtn = document.getElementById("clear");
const statusEl = document.getElementById("status");
const libpanel = document.getElementById("libpanel");
const libtoggle = document.getElementById("libtoggle");
const liblist = document.getElementById("liblist");

function selectedLibIds() {
  return [...liblist.querySelectorAll("input:checked")].map(cb => cb.value);
}

function updateLibLabel() {
  const n = selectedLibIds().length;
  libtoggle.textContent = n ? `📚 Bibliotek (${n} valda)` : "📚 Bibliotek";
}

async function refreshLibrary() {
  try {
    const docs = await fetch("/v1/library").then(r => r.json());
    if (!docs.length) {
      liblist.innerHTML = '<span class="none">Biblioteket är tomt — värddatorn kan lägga in dokument via sin panel.</span>';
      return;
    }
    liblist.innerHTML = docs.map(d =>
      `<label><input type="checkbox" value="${d.id}"> ${d.name} <span class="c">(${d.chars} tecken)</span></label>`
    ).join("");
    let saved = [];
    try { saved = JSON.parse(localStorage.getItem("vibe_lib_sel") || "[]"); } catch {}
    const valid = new Set(docs.map(d => d.id));
    saved = saved.filter(id => valid.has(id));
    try { localStorage.setItem("vibe_lib_sel", JSON.stringify(saved)); } catch {}
    liblist.querySelectorAll("input").forEach(cb => {
      if (saved.includes(cb.value)) cb.checked = true;
    });
  } catch {
    liblist.innerHTML = '<span class="none">Kunde inte läsa biblioteket.</span>';
  }
  updateLibLabel();
}

libtoggle.addEventListener("click", () => {
  libpanel.classList.toggle("open");
  if (libpanel.classList.contains("open")) refreshLibrary();
});
liblist.addEventListener("change", () => {
  updateLibLabel();
  try { localStorage.setItem("vibe_lib_sel", JSON.stringify(selectedLibIds())); } catch {}
});

const history = [];
let SYSTEM_PROMPT = "Du är en hjälpsam AI-assistent. Svara alltid på svenska, även om frågan ställs på ett annat språk.";

function addMsg(role, text, loading) {
  const div = document.createElement("div");
  div.className = "msg " + (role === "user" ? "user" : "ai") + (loading ? " loading" : "");
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

async function checkHealth() {
  try {
    const r = await fetch("/health");
    statusEl.textContent = r.ok ? "Ansluten" : "Fel (" + r.status + ")";
    statusEl.className = "status " + (r.ok ? "ok" : "err");
  } catch {
    statusEl.textContent = "Ingen anslutning";
    statusEl.className = "status err";
  }
}

function libNames() {
  return [...liblist.querySelectorAll("input:checked")].map(
    cb => cb.textContent.trim().split(" (")[0]
  );
}

async function ask(question) {
  history.push({ role: "user", content: question });
  const sel = selectedLibIds();
  if (sel.length) {
    const note = document.createElement("div");
    note.className = "note-msg";
    note.textContent = "📚 Skickar med bibliotek: " + libNames().join(", ");
    chat.appendChild(note);
    chat.scrollTop = chat.scrollHeight;
  }
  const bubble = addMsg("ai", "Väntar på godkännande från värddatorn…", true);
  const thinkTimer = setTimeout(() => {
    if (bubble.classList.contains("loading")) {
      bubble.textContent = "Modellen tänker… frågor med bibliotek kan ta upp till en minut (CPU).";
    }
  }, 8000);
  send.disabled = true;
  try {
    const r = await fetch("/v1/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        messages: [{ role: "system", content: SYSTEM_PROMPT }, ...history],
        max_tokens: 1024,
        stream: true,
        library: sel,
        client_name: userName,
      }),
    });
    if (!r.ok) {
      const data = await r.json().catch(() => null);
      throw new Error(data?.error?.message || ("HTTP " + r.status));
    }
    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    let answer = "";
    let first = true;
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, idx).trim();
        buf = buf.slice(idx + 1);
        if (!line.startsWith("data:")) continue;
        const payload = line.slice(5).trim();
        if (payload === "[DONE]") continue;
        try {
          const j = JSON.parse(payload);
          const delta = j.choices?.[0]?.delta?.content || "";
          if (delta) {
            if (first) {
              clearTimeout(thinkTimer);
              bubble.classList.remove("loading");
              first = false;
            }
            answer += delta;
            bubble.textContent = answer;
            chat.scrollTop = chat.scrollHeight;
          }
        } catch {}
      }
    }
    clearTimeout(thinkTimer);
    bubble.classList.remove("loading");
    bubble.textContent = answer.trim() || "(tomt svar)";
    history.push({ role: "assistant", content: bubble.textContent });
  } catch (err) {
    const msg = err.message || "";
    if (msg.includes("denied")) {
      bubble.textContent = "Nekad av värddatorn.";
    } else if (msg.includes("no decision")) {
      bubble.textContent = "Inget svar från värddatorn i tid — försök igen.";
    } else {
      bubble.textContent = "Fel: " + msg;
    }
    clearTimeout(thinkTimer);
    bubble.classList.remove("loading");
  }
  send.disabled = false;
  input.focus();
}

form.addEventListener("submit", (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || send.disabled) return;
  if (!userName) {
    namegate.classList.remove("hidden");
    nameinput.focus();
    return;
  }
  input.value = "";
  addMsg("user", text);
  ask(text);
});

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    form.requestSubmit();
  }
});

clearBtn.addEventListener("click", () => {
  history.length = 0;
  chat.innerHTML = "";
  addMsg("ai", "Konversationen rensad. Vad vill du veta?");
});

checkHealth();
setInterval(checkHealth, 30000);
refreshLibrary();

async function loadSettings() {
  try {
    const s = await fetch("/v1/settings").then(r => r.json());
    if (s.system_prompt) SYSTEM_PROMPT = s.system_prompt;
    if (s.welcome) {
      const first = chat.querySelector(".msg.ai");
      if (first && !history.length) first.textContent = s.welcome;
    }
  } catch {}
}
loadSettings();
</script>
</body>
</html>
